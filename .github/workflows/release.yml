name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "*v*.*.*"

jobs:
  release-android:
    name: Release Android
    runs-on: ubuntu-24.04
    steps:
      - name: Free up disk space
        run: |
          echo "=== Disk space before ==="
          df -h /
          echo

          echo "=== Directory existence check ==="
          for dir in /usr/share/dotnet /usr/share/swift /usr/local/.ghcup; do
            if [ -d "$dir" ]; then echo "$dir exists"; else echo "$dir does not exist"; fi
          done
          echo

          echo "=== Removing .NET, Swift and Haskell ==="
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup
          echo "=== Removed ==="
          echo

          echo "=== Disk space after ==="
          df -h /

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml

      - name: Create services config
        env:
          CONFIG_SERVICES_DART: ${{ secrets.CONFIG_SERVICES_DART }}
        run: printf '%s\n' "${CONFIG_SERVICES_DART:?secret is not set}" > lib/config_services.dart

      - name: Build Android release
        run: |
          unset ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_LATEST_HOME ANDROID_NDK_ROOT
          make build-android-release-aab

      - name: Create release assets
        run: |
          mkdir -p target/assets
          mv build/app/outputs/bundle/release/app-release.aab "target/assets/android-release-$GITHUB_REF_NAME.aab"

      - name: Upload assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            target/assets/*.aab

  release-web:
    name: Release Web
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create services config
        env:
          CONFIG_SERVICES_DART: ${{ secrets.CONFIG_SERVICES_DART }}
        run: printf '%s\n' "${CONFIG_SERVICES_DART:?secret is not set}" > lib/config_services.dart

      - name: Download web dependencies
        run: |
          make remove-and-download-drift-web-dependencies
          make remove-and-download-native-push-web-dependencies
          make remove-and-download-mobile-scanner-web-dependencies

      - name: Build web
        uses: ./.github/actions/build-web

      - name: Create release assets
        run: |
          mkdir -p target/assets
          mv build/web-release.tar.gz "target/assets/web-release-$GITHUB_REF_NAME.tar.gz"

      - name: Upload assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            target/assets/*.tar.gz
