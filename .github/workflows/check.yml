name: Check

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, analyze and test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Create placeholder config
        run: make create-placeholder-config-services

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: make check-fmt

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: make test

  spell-check:
    name: Spell check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Spell check
        run: npx --yes cspell@10.5.1 --config cspell.jsonc --gitignore --no-progress .
