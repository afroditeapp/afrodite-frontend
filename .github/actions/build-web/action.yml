name: Build web
description: Build the web release, including rust_utils for WebAssembly
runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version-file: pubspec.yaml
        cache: true

    - name: Install wasm-pack
      shell: bash
      run: |
        curl -sL "https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz" -o wasm-pack.tar.gz
        echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  wasm-pack.tar.gz" | shasum -a 256 -c
        tar -xzf wasm-pack.tar.gz
        sudo mv wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/
        wasm-pack --version

    - name: Build rust utils for web
      shell: bash
      run: make build-rust-utils-for-web

    - name: Build web release
      shell: bash
      run: make build-web-release
