[package]
name = "rust_utils"
edition = "2024"
publish = false

[lib]
name = "rust_utils"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib"]

[profile.dev]
panic = "abort"
opt-level = 3

[profile.release]
panic = "abort"

[dependencies]
pgp = { version = "0.21.0", default-features = false }
smallvec = "1.15.2"
rand = "0.8.7"
wasm-bindgen = "0.2.127"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[target.wasm32-unknown-unknown.dependencies]
pgp = { version = "0.21.0", default-features = false, features = ["wasm"] }
